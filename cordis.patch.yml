# dsh bundle patch: inserts the routed subagent tool into a profile's layer stack.
#
# A later profile patch can supply rootModels and models to enable delegation.
# Without them, the plugin stays inert and leaves its settings card available.
# Minimal example:
#
# - id: routed-subagent
#   config:
#     maxDepth: 1
#     rootModels: [reasoner]
#     models:
#       reasoner:
#         provider: deepseek
#         model: deepseek-reasoner
#         reasoningEfforts: [high]
#         maxTokens: 65536
#         description: 'Architecture, multi-step reasoning, and hard debugging.'
- insert:
    - id: routed-subagent
      name: 'dsh-routed-subagent'
