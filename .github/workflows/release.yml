name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install pnpm
        run: npm i -g pnpm@10
      - name: Validate release tag
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must be a stable semantic version (vMAJOR.MINOR.PATCH)." >&2; exit 1 ;;
          esac
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and test
        run: pnpm test
      - name: Build release assets
        shell: bash
        run: |
          mkdir release
          pnpm pack --pack-destination release
          cd release
          sha256sum ./*.tgz > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.tgz release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "dsh-routed-subagent $GITHUB_REF_NAME"